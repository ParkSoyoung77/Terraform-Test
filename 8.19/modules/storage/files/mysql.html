<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>std17-db-check</title>
<style>
  :root {
    --bg: #14110c;
    --panel: #1b1712;
    --amber: #ffb000;
    --amber-dim: #a86f00;
    --amber-faint: #5c4620;
    --text: #f4e4c1;
    --text-dim: #9a8a68;
    --green: #6fcf6f;
    --red: #ff6b6b;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "IBM Plex Mono", "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    background: repeating-linear-gradient(
      to bottom,
      rgba(255, 176, 0, 0.035) 0px,
      rgba(255, 176, 0, 0.035) 1px,
      transparent 1px,
      transparent 3px
    );
    z-index: 5;
  }

  .wrap {
    width: min(560px, 92vw);
    position: relative;
    z-index: 10;
  }

  .titlebar {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 14px;
    background: #201b14;
    border: 1px solid var(--amber-faint);
    border-bottom: none;
    border-radius: 6px 6px 0 0;
  }

  .dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--amber-faint);
  }

  .titlebar span.label {
    margin-left: 8px;
    font-size: 12px;
    color: var(--text-dim);
    letter-spacing: 0.04em;
  }

  .terminal {
    background: var(--panel);
    border: 1px solid var(--amber-faint);
    border-radius: 0 0 6px 6px;
    padding: 34px 30px;
    box-shadow: 0 0 40px rgba(255, 176, 0, 0.06), inset 0 0 60px rgba(255, 176, 0, 0.02);
  }

  h1 {
    margin: 0 0 6px;
    font-size: 24px;
    font-weight: 700;
    color: var(--amber);
    text-shadow: 0 0 18px rgba(255, 176, 0, 0.35);
  }

  .sub {
    margin: 0 0 28px;
    font-size: 13px;
    color: var(--text-dim);
  }

  button {
    font-family: inherit;
    font-size: 14px;
    background: transparent;
    color: var(--amber);
    border: 1px solid var(--amber-dim);
    border-radius: 4px;
    padding: 12px 22px;
    cursor: pointer;
    letter-spacing: 0.03em;
    transition: background 0.15s ease, box-shadow 0.15s ease;
  }

  button:hover {
    background: rgba(255, 176, 0, 0.08);
    box-shadow: 0 0 16px rgba(255, 176, 0, 0.15);
  }

  button:active {
    transform: translateY(1px);
  }

  button:disabled {
    opacity: 0.5;
    cursor: default;
  }

  #result {
    margin-top: 22px;
    min-height: 24px;
    font-size: 13px;
    line-height: 1.8;
    white-space: pre-wrap;
  }

  #result .prompt { color: var(--text-dim); }
  #result .ok { color: var(--green); }
  #result .fail { color: var(--red); }
  #result .pending { color: var(--text-dim); }

  .cursor {
    display: inline-block;
    width: 7px;
    height: 13px;
    background: var(--amber);
    margin-left: 4px;
    vertical-align: middle;
    animation: blink 1s steps(1) infinite;
  }

  @keyframes blink {
    0%, 49% { opacity: 1; }
    50%, 100% { opacity: 0; }
  }
</style>
</head>
<body>

  <div class="wrap">
    <div class="titlebar">
      <div class="dot"></div>
      <div class="dot"></div>
      <div class="dot"></div>
      <span class="label">std17@ap-northeast-3 — db-check</span>
    </div>

    <div class="terminal">
      <h1>DB 연결 상태 확인</h1>
      <p class="sub">FastAPI → MySQL(로컬) 연결 여부를 테스트합니다.</p>

      <button id="checkBtn" onclick="checkDB()">$ 연결 테스트 실행</button>

      <div id="result"></div>
    </div>
  </div>

  <script>
    async function checkDB() {
      const btn = document.getElementById("checkBtn");
      const resultDiv = document.getElementById("result");

      btn.disabled = true;
      resultDiv.innerHTML = '<span class="prompt">$ curl /api/db-check</span>\n<span class="pending">확인 중...<span class="cursor"></span></span>';

      try {
        const res = await fetch("/api/db-check");
        const contentType = res.headers.get("content-type") || "";

        if (!contentType.includes("application/json")) {
          throw new Error(`서버가 JSON이 아닌 응답을 반환함 (status ${res.status})`);
        }

        const data = await res.json();
        const isSuccess = data.status === "Success";

        resultDiv.innerHTML =
          '<span class="prompt">$ curl /api/db-check</span>\n' +
          `<span class="${isSuccess ? 'ok' : 'fail'}">{"status": "${data.status}"}</span>`;
      } catch (err) {
        resultDiv.innerHTML =
          '<span class="prompt">$ curl /api/db-check</span>\n' +
          `<span class="fail">요청 실패: ${err.message}</span>`;
      } finally {
        btn.disabled = false;
      }
    }
  </script>

</body>
</html>
